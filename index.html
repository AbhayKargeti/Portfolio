<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abhay Kargeti – Full-Stack Software Developer</title>
    <meta
      name="description"
      content="Abhay Kargeti is a full-stack AI engineer in Faridabad, India, building web applications and enterprise software with Laravel, Java, and React."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://github-contributions-api.jogruber.de" crossorigin />
    <script>
      // Set the saved theme before the first paint so the page doesn't flash.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch (e) {}
        var dark = saved === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : saved !== 'light'
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
